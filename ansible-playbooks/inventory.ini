# Virtual Simulation Cluster - Example Targets Only
# These are example virtual hosts for local simulation only.
# They are not real production servers, and no real credentials are stored here.
[virtual_nodes]
sim-node01.local ansible_host=192.168.10.11 ansible_user=sysadmin
sim-node02.local ansible_host=192.168.10.12 ansible_user=sysadmin
sim-node03.local ansible_host=192.168.10.13 ansible_user=sysadmin

[all:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
